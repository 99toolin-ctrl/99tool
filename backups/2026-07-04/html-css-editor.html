  <style>
    .editor-layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
      height: 85vh;
      margin-top: 20px;
    }

    .code-panes {
      display: grid;
      grid-template-rows: 1fr 1fr;
      gap: 15px;
    }

    .editor-pane {
      background: var(--dark-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .pane-header {
      padding: 10px 16px;
      background: rgba(0,0,0,0.3);
      border-bottom: 1px solid var(--border);
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .code-input {
      flex: 1;
      width: 100%;
      border: none;
      background: transparent;
      color: #e0e0e0;
      padding: 15px;
      font-family: 'Fira Code', monospace;
      font-size: 0.9rem;
      line-height: 1.5;
      resize: none;
      outline: none;
    }

    .preview-pane {
      background: white;
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }

    #preview-frame {
      flex: 1;
      width: 100%;
      border: none;
      background: white;
      min-height: 300px;
    }

    @media (min-width: 1000px) {
      .editor-layout {
        grid-template-columns: 450px 1fr;
      }
      .code-panes {
        grid-template-rows: none;
        grid-template-columns: 1fr 1fr;
      }
    }

    .action-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      padding: 0 5px 10px;
    }

    #update-status {
      font-size: 0.75rem;
      padding: 4px 0;
    }
  </style>

<body>
  <div id="site-header"></div>

  <main class="container py-5">
    <div class="text-center mb-3">
      <h1>HTML/CSS Live Editor</h1>
      <p class="text-muted">Write HTML and CSS, see instant live preview. Export your project as a single HTML file.</p>
    </div>

    <div class="editor-layout">
      <div class="code-panes">
        <section class="editor-pane">
          <div class="pane-header">
            <span>HTML</span>
            <span id="html-count">0 chars</span>
          </div>
          <textarea id="htmlArea" class="code-input" placeholder="Enter your HTML here..."></textarea>
        </section>

        <section class="editor-pane">
          <div class="pane-header">
            <span>CSS</span>
            <span id="css-count">0 chars</span>
          </div>
          <textarea id="cssArea" class="code-input" placeholder="Enter your CSS here..."></textarea>
        </section>
      </div>

      <section class="editor-pane preview-pane">
        <div class="pane-header">
          <span>Live Preview</span>
          <span id="update-status">● Ready</span>
        </div>
        <iframe id="preview-frame"></iframe>
      </section>
    </div>

    <div class="action-bar">
      <div id="char-counts" class="text-muted" style="font-size:0.8rem;"></div>
      <div class="flex gap-1">
        <button id="copy-btn" class="btn btn-secondary btn-sm">Copy HTML</button>
        <button id="export-btn" class="btn btn-primary btn-sm">Export HTML</button>
        <button id="reset-btn" class="btn btn-outline btn-sm">Reset</button>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="../../assets/js/main.js"></script>
  <script>
    const htmlArea = document.getElementById('htmlArea');
    const cssArea = document.getElementById('cssArea');
    const previewFrame = document.getElementById('preview-frame');
    const exportBtn = document.getElementById('export-btn');
    const resetBtn = document.getElementById('reset-btn');
    const copyBtn = document.getElementById('copy-btn');
    const updateStatus = document.getElementById('update-status');
    const htmlCount = document.getElementById('html-count');
    const cssCount = document.getElementById('css-count');

    function buildPreviewDoc() {
      return `<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>${cssArea.value}</style>
</head>
<body>${htmlArea.value}</body>
</html>`;
    }

    function updatePreview() {
      try {
        previewFrame.srcdoc = buildPreviewDoc();
        updateStatus.textContent = '● Synced';
        updateStatus.style.color = '#28a745';
        localStorage.setItem('99tool_live_html', htmlArea.value);
        localStorage.setItem('99tool_live_css', cssArea.value);
      } catch (e) {
        updateStatus.textContent = '● Error';
        updateStatus.style.color = '#dc3545';
      }
      htmlCount.textContent = htmlArea.value.length + ' chars';
      cssCount.textContent = cssArea.value.length + ' chars';
    }

    let debounceTimer;
    function debouncedUpdate() {
      updateStatus.textContent = '● Compiling...';
      updateStatus.style.color = '#ffc107';
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(updatePreview, 300);
    }

    htmlArea.addEventListener('input', debouncedUpdate);
    cssArea.addEventListener('input', debouncedUpdate);

    copyBtn.addEventListener('click', () => {
      const text = buildPreviewDoc();
      navigator.clipboard.writeText(text).then(() => {
        copyBtn.textContent = 'Copied!';
        setTimeout(() => { copyBtn.textContent = 'Copy HTML'; }, 1800);
      }).catch(() => {
        alert('Copy failed. Try selecting manually.');
      });
    });

    exportBtn.addEventListener('click', () => {
      const fullHtml = `<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Project</title>
<style>
${cssArea.value}
</style>
</head>
<body>
${htmlArea.value}
</body>
</html>`;
      const blob = new Blob([fullHtml], { type: 'text/html' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'my-project.html';
      a.click();
      URL.revokeObjectURL(url);
    });

    resetBtn.addEventListener('click', () => {
      if (confirm('Reset all code to defaults? This will erase your current work.')) {
        htmlArea.value = `<div class="card">
  <h1>Hello 99tool!</h1>
  <p>Start editing HTML on the left and CSS in the middle to see live preview on the right.</p>
</div>`;
        cssArea.value = `body {
  font-family: system-ui, sans-serif;
  display: grid;
  place-items: center;
  min-height: 100vh;
  margin: 0;
  background: #f0f0f0;
}
.card {
  background: white;
  padding: 2rem;
  border-radius: 12px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.1);
  max-width: 500px;
  text-align: center;
}
.card h1 { color: #e53935; margin-bottom: 0.5rem; }
.card p { color: #555; line-height: 1.6; }`;
        updatePreview();
      }
    });

    window.addEventListener('load', () => {
      const savedHtml = localStorage.getItem('99tool_live_html');
      const savedCss = localStorage.getItem('99tool_live_css');
      if (savedHtml) htmlArea.value = savedHtml;
      if (savedCss) cssArea.value = savedCss;
      updatePreview();
    });
  </script>
</body>
</html>
