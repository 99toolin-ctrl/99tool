  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet" />

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    .doc-layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
      margin-top: 20px;
      min-height: 70vh;
    }

    .editor-pane {
      background: var(--dark-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .pane-header {
      padding: 10px 16px;
      background: rgba(0,0,0,0.3);
      border-bottom: 1px solid var(--border);
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #doc-input {
      flex: 1;
      width: 100%;
      border: none;
      background: transparent;
      color: #e0e0e0;
      padding: 15px;
      font-family: 'Fira Code', monospace;
      font-size: 0.9rem;
      line-height: 1.6;
      resize: none;
      outline: none;
      min-height: 300px;
    }

    .preview-pane {
      background: #fdfdfd;
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }

    #doc-preview {
      flex: 1;
      padding: 30px 40px;
      overflow-y: auto;
      color: #333;
      background: white;
      min-height: 300px;
    }

    #doc-preview h1 {
      font-size: 2.2rem;
      color: #1a1a1b;
      border-bottom: 2px solid #eee;
      padding-bottom: 15px;
      margin-bottom: 25px;
    }

    #doc-preview h2 {
      font-size: 1.6rem;
      color: #2d3436;
      margin-top: 35px;
      border-bottom: 1px solid #eee;
      padding-bottom: 10px;
    }

    #doc-preview h3 {
      font-size: 1.2rem;
      color: #2d3436;
      margin-top: 25px;
    }

    #doc-preview p {
      font-size: 1rem;
      color: #444;
      line-height: 1.8;
      margin-bottom: 1.2rem;
    }

    #doc-preview code {
      background: #f1f2f6;
      padding: 2px 5px;
      border-radius: 4px;
      font-family: 'Fira Code', monospace;
      color: #d63031;
    }

    #doc-preview pre {
      background: #2d3436;
      padding: 20px;
      border-radius: 8px;
      overflow-x: auto;
      color: #dfe6e9;
      margin: 20px 0;
    }

    #doc-preview pre code {
      background: none;
      color: inherit;
      padding: 0;
    }

    #doc-preview blockquote {
      border-left: 5px solid #0984e3;
      background: #f1f9ff;
      padding: 15px 20px;
      margin: 25px 0;
      font-style: italic;
      color: #2d3436;
    }

    #doc-preview ul, #doc-preview ol {
      padding-left: 22px;
      margin-bottom: 1rem;
      color: #444;
    }

    #doc-preview li {
      margin-bottom: 6px;
      line-height: 1.6;
    }

    #doc-preview a {
      color: #e53935;
    }

    @media (min-width: 900px) {
      .doc-layout {
        grid-template-columns: 450px 1fr;
        min-height: 75vh;
      }
      #doc-input {
        min-height: 500px;
      }
      #doc-preview {
        min-height: 500px;
      }
    }

    .action-bar {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 15px;
    }
  </style>
</head>
<body>
  <div id="site-header"></div>

  <main class="container py-5">
    <div class="text-center mb-3">
      <h1>Documentation Generator</h1>
      <p class="text-muted">Write in Markdown, preview live HTML, and export professional documentation in seconds.</p>
    </div>

    <div class="doc-layout">
      <section class="editor-pane">
        <div class="pane-header">
          <span>Markdown Input</span>
          <span id="char-count">0 chars</span>
        </div>
        <textarea id="doc-input" placeholder="Write your documentation in Markdown..."></textarea>
      </section>

      <section class="editor-pane preview-pane">
        <div class="pane-header">
          <span>HTML Preview</span>
          <span id="word-count">0 words</span>
        </div>
        <div id="doc-preview"></div>
      </section>
    </div>

    <div class="action-bar">
      <button id="word-btn" class="btn btn-secondary btn-sm">Word Count</button>
      <button id="reset-btn" class="btn btn-outline btn-sm">Reset</button>
      <button id="export-btn" class="btn btn-primary btn-sm">Export HTML</button>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="../../assets/js/main.js"></script>
  <script>
    const docInput = document.getElementById('doc-input');
    const docPreview = document.getElementById('doc-preview');
    const exportBtn = document.getElementById('export-btn');
    const resetBtn = document.getElementById('reset-btn');
    const wordBtn = document.getElementById('word-btn');
    const charCount = document.getElementById('char-count');
    const wordCount = document.getElementById('word-count');

    const DEFAULT_TEMPLATE = `# API Documentation v1.0

Welcome to the official documentation for your project.

## Getting Started

Clone the repository and install dependencies:

\`\`\`bash
git clone https://github.com/example/project.git
cd project
npm install
\`\`\`

## Authentication

All API requests must include a valid Bearer token in the Authorization header.

\`\`\`bash
curl -H "Authorization: Bearer [token]" https://api.example.com/v1/users
\`\`\`

## Rate Limiting

We enforce a rate limit of **100 requests per minute** per API key. Exceeding this limit returns a \`429 Too Many Requests\` response.

## Endpoints

### GET /users

Returns a list of all users.

> **Note:** Requires \`read:users\` scope.

### POST /users

Creates a new user account. Accepts JSON body with \`name\`, \`email\`, and \`password\` fields.

## Error Codes

| Code | Meaning |
|------|---------|
| 400  | Bad Request — invalid input |
| 401  | Unauthorized — missing or invalid token |
| 403  | Forbidden — insufficient permissions |
| 429  | Too Many Requests — rate limit exceeded |
| 500  | Internal Server Error |

## Support

For issues and feature requests, visit [99tool.in](https://99tool.in).`;

    function countWords(text) {
      return text.trim() ? text.trim().split(/\s+/).length : 0;
    }

    function updatePreview() {
      const md = docInput.value;
      docPreview.innerHTML = marked.parse(md);
      charCount.textContent = md.length + ' chars';
      wordCount.textContent = countWords(md) + ' words';
      localStorage.setItem('doc_md', md);
    }

    let debounceTimer;
    docInput.addEventListener('input', () => {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(updatePreview, 250);
    });

    exportBtn.addEventListener('click', () => {
      const htmlContent = docPreview.innerHTML;
      const fullHtml = `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Documentation</title>
  <style>
    body { font-family: Arial, Helvetica, sans-serif; line-height: 1.6; padding: 40px; max-width: 900px; margin: auto; background: #f9f9f9; color: #333; }
    h1 { font-size: 2.2rem; color: #1a1a1b; border-bottom: 2px solid #eee; padding-bottom: 15px; }
    h2 { font-size: 1.6rem; color: #2d3436; margin-top: 35px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
    p { margin-bottom: 1.2rem; }
    code { background: #f1f2f6; padding: 2px 5px; border-radius: 4px; font-family: monospace; color: #d63031; }
    pre { background: #2d3436; color: #dfe6e9; padding: 20px; border-radius: 8px; overflow-x: auto; }
    pre code { background: none; color: inherit; }
    blockquote { border-left: 5px solid #0984e3; background: #f1f9ff; padding: 15px 20px; margin: 25px 0; font-style: italic; }
    table { border-collapse: collapse; width: 100%; margin: 20px 0; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
    th { background: #f0f0f0; }
    a { color: #e53935; }
  </style>
</head>
<body>
${htmlContent}
</body>
</html>`;
      const blob = new Blob([fullHtml], { type: 'text/html' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'documentation.html';
      a.click();
      URL.revokeObjectURL(url);
    });

    resetBtn.addEventListener('click', () => {
      if (confirm('Reset documentation to the default template? This will erase your current work.')) {
        docInput.value = DEFAULT_TEMPLATE;
        updatePreview();
      }
    });

    wordBtn.addEventListener('click', () => {
      const words = countWords(docInput.value);
      const chars = docInput.value.length;
      alert(`Words: ${words}\nCharacters: ${chars}`);
    });

    window.addEventListener('load', () => {
      const saved = localStorage.getItem('doc_md');
      if (saved) {
        docInput.value = saved;
      } else {
        docInput.value = DEFAULT_TEMPLATE;
      }
      updatePreview();
    });
  </script>
</body>
</html>
